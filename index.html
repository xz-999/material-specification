<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电视剧-雁回时</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: {
            950: '#0a0a0a',
            900: '#111111',
            800: '#1a1a1a',
            700: '#242424',
            600: '#333333',
            500: '#555555',
            400: '#7a7a7a',
            300: '#a3a3a3',
            200: '#d4d4d4',
            100: '#eaeaea',
            50: '#f7f7f7'
          }
        },
        fontFamily: {
          sans: ['-apple-system','BlinkMacSystemFont','"PingFang SC"','"Microsoft YaHei"','Helvetica','Arial','sans-serif']
        }
      }
    }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .fade-in { animation: fadeIn .4s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
  .tab-underline { position: relative; }
  .tab-underline::after {
    content: '';
    position: absolute;
    left: 0; bottom: -1px;
    width: 100%; height: 2px;
    background: #fff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .25s ease;
  }
  .tab-underline.active::after { transform: scaleX(1); }
  .point-flash { border-color: #d4d4d4 !important; box-shadow: 0 0 0 1px rgba(212,212,212,.35); }
  .media-hover-zoom { z-index: 1; }
  .media-hover-zoom:hover { z-index: 20; }
  .media-hover-zoom:hover .media-zoom-target { transform: scale(1.6); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  .poster-hover-zoom:hover .poster-zoom-target { transform: scale(1.05); }
  .merged-poster-item { width: calc(50% - 0.375rem); }
  @media (min-width: 640px) { .merged-poster-item { width: calc(33.333% - 0.5rem); } }
  @media (min-width: 1024px) { .merged-poster-item { width: calc(25% - 0.5625rem); } }
  .play-hint.opacity-0 { opacity: 0; }
  .video-poster, video.video-autoplay { transition: opacity .25s ease, transform .3s ease; }
  .video-poster.opacity-0, video.video-autoplay.opacity-0 { opacity: 0; }
  .drama-caret {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid #d4d4d4;
    transition: border-top-color .2s ease, transform .2s ease;
  }
  .group:hover .drama-caret { border-top-color: #ffffff; }
  .drama-caret.is-open { transform: scaleY(-1); }

  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="light"] .bg-ink-950 { background-color: #f7f7f7 !important; }
  html[data-theme="light"] .bg-ink-900 { background-color: #ffffff !important; }
  html[data-theme="light"] .bg-ink-800 { background-color: #eeeeee !important; }
  html[data-theme="light"] .bg-ink-700 { background-color: #e2e2e2 !important; }
  html[data-theme="light"] .border-ink-800 { border-color: #e2e2e2 !important; }
  html[data-theme="light"] .border-ink-700 { border-color: #d4d4d4 !important; }
  html[data-theme="light"] .border-ink-600 { border-color: #b5b5b5 !important; }
  html[data-theme="light"] .text-ink-50 { color: #111111 !important; }
  html[data-theme="light"] .text-ink-100 { color: #1a1a1a !important; }
  html[data-theme="light"] .text-ink-200 { color: #333333 !important; }
  html[data-theme="light"] .text-ink-300 { color: #555555 !important; }
  html[data-theme="light"] .text-ink-400 { color: #7a7a7a !important; }
  html[data-theme="light"] .text-ink-500 { color: #8f8f8f !important; }
  html[data-theme="light"] .text-ink-600 { color: #a3a3a3 !important; }
  html[data-theme="light"] .hover\:bg-ink-800:hover { background-color: #eeeeee !important; }
  html[data-theme="light"] .hover\:bg-ink-700\/50:hover { background-color: rgba(238,238,238,.6) !important; }
  html[data-theme="light"] .hover\:bg-ink-700\/40:hover { background-color: rgba(238,238,238,.5) !important; }
  html[data-theme="light"] .hover\:bg-ink-700\/60:hover { background-color: rgba(230,230,230,.7) !important; }
  html[data-theme="light"] .hover\:border-ink-600:hover { border-color: #b5b5b5 !important; }
  html[data-theme="light"] .hover\:text-ink-100:hover { color: #1a1a1a !important; }
  html[data-theme="light"] .hover\:text-ink-200:hover { color: #333333 !important; }
  html[data-theme="light"] .text-white { color: #111111 !important; }
  html[data-theme="light"] .text-white\/85 { color: #4d4d4d !important; }
  html[data-theme="light"] .text-white\/70 { color: #6b6b6b !important; }
  html[data-theme="light"] .text-white\/60 { color: #7a7a7a !important; }
  html[data-theme="light"] .hover\:text-white:hover { color: #000000 !important; }
  html[data-theme="light"] .bg-ink-800\/40 { background-color: rgba(238,238,238,.6) !important; }
  html[data-theme="light"] .bg-ink-800\/50 { background-color: rgba(238,238,238,.7) !important; }
  html[data-theme="light"] .bg-ink-950\/80 { background-color: rgba(247,247,247,.85) !important; }
  html[data-theme="light"] .hover\:bg-ink-800\/60:hover { background-color: rgba(238,238,238,.7) !important; }
  html[data-theme="light"] .hover\:bg-ink-700\/40:hover { background-color: rgba(226,226,226,.6) !important; }
  html[data-theme="light"] .hover\:bg-ink-700\/50:hover { background-color: rgba(226,226,226,.7) !important; }
  html[data-theme="light"] .hover\:bg-ink-700\/60:hover { background-color: rgba(220,220,220,.75) !important; }
  html[data-theme="light"] .text-white\/50 { color: #8f8f8f !important; }
  html[data-theme="light"] .text-white\/90 { color: #222222 !important; }
  html[data-theme="light"] .hover\:text-white\/90:hover { color: #000000 !important; }
  html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #c4c4c4; }
  html[data-theme="light"] .tab-underline::after { background: #1a1a1a; }
  html[data-theme="light"] .drama-caret { border-top-color: #555555; }
  html[data-theme="light"] .group:hover .drama-caret { border-top-color: #000000; }

  html[data-theme="light"] #pointPreviewModal .text-white,
  html[data-theme="light"] #pointPreviewModal .text-white\/85,
  html[data-theme="light"] #pointPreviewModal .text-white\/70,
  html[data-theme="light"] #pointPreviewModal .text-white\/60,
  html[data-theme="light"] #pointPreviewModal .text-white\/50,
  html[data-theme="light"] #pointPreviewModal .text-white\/90,
  html[data-theme="light"] #pointPreviewModal .hover\:text-white:hover,
  html[data-theme="light"] #pointPreviewModal .hover\:text-white\/90:hover {
    color: #ffffff !important;
  }
  html[data-theme="light"] .ri-zoom-in-line.text-white { color: #ffffff !important; }
</style>
</head>
<body class="bg-ink-950 text-ink-100 font-sans min-h-screen">

  <header class="border-b border-ink-800 sticky top-0 z-40 bg-ink-950">
    <div class="max-w-[1600px] mx-auto px-6 md:px-10 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 id="dramaTitle" class="text-base md:text-lg font-medium tracking-wide">电视剧-雁回时</h1>
      </div>
      <div class="flex items-center gap-2">
        <img src="https://vfiles.gtimg.cn/wupload/xy/starter/f7e7c072.png" alt="logo" class="h-4 md:h-5 w-auto object-contain ml-2" />
      </div>
    </div>

    <nav class="max-w-[1600px] mx-auto px-6 md:px-10">
      <div class="flex items-center justify-between text-sm">
        <div class="flex gap-8">
          <button data-tab="app" class="tab-btn tab-underline active py-4 text-ink-100 font-medium">
            APP内素材
          </button>
          <button data-tab="other" class="tab-btn tab-underline py-4 text-ink-400 font-medium">
            APP外素材
          </button>
        </div>
        <div class="flex items-center gap-1">
          <div id="themeEntryMount" class="flex items-center"></div>
          <a id="specEntryLink" href="./spec.html" class="tab-underline py-4 text-ink-400 font-medium hover:text-ink-200 transition-colors">
            素材规范
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 md:px-10 py-10">

    <section id="panel-app" class="tab-panel fade-in">
      <div class="flex gap-6 items-start">
        <aside id="episodeSidebar" class="flex-shrink-0 w-48 border border-ink-800 rounded-[6px] bg-ink-900 overflow-hidden transition-all duration-200 sticky flex flex-col" style="top: var(--header-height, 8rem); max-height: calc(100vh - var(--header-height, 8rem) - 1.5rem);">
          <div class="flex items-center justify-between px-4 py-3 border-b border-ink-800">
            <span class="text-xs text-white/70 tracking-wide sidebar-label">目录</span>
            <button id="sidebarToggleBtn" class="w-6 h-6 rounded-[6px] flex items-center justify-center text-ink-500 hover:text-ink-200 transition-colors flex-shrink-0">
              <i class="ri-side-bar-line"></i>
            </button>
          </div>
          <div id="episodeTabs" class="flex flex-col py-2 overflow-y-auto flex-1"></div>
        </aside>

        <div id="episodeContent" class="flex-1 min-w-0"></div>
      </div>
    </section>

    <section id="panel-other" class="tab-panel hidden">
      <div class="flex items-center gap-8 border-b border-ink-800 mb-6 text-sm">
        <button data-other-type="static" class="other-type-btn tab-underline active py-3 text-ink-100 font-medium">
          静态素材
        </button>
        <button data-other-type="video" class="other-type-btn tab-underline py-3 text-ink-400 font-medium">
          视频素材
        </button>
      </div>

      <div class="flex gap-6 items-start">
        <aside id="otherSidebar" class="flex-shrink-0 w-48 border border-ink-800 rounded-[6px] bg-ink-900 overflow-hidden transition-all duration-200 sticky flex flex-col" style="top: var(--header-height, 8rem); max-height: calc(100vh - var(--header-height, 8rem) - 1.5rem);">
          <div class="flex items-center justify-between px-4 py-3 border-b border-ink-800">
            <span class="text-xs text-white/70 tracking-wide sidebar-label">目录</span>
            <button id="otherSidebarToggleBtn" class="w-6 h-6 rounded-[6px] flex items-center justify-center text-ink-500 hover:text-ink-200 transition-colors flex-shrink-0">
              <i class="ri-side-bar-line"></i>
            </button>
          </div>
          <div id="otherTabs" class="flex flex-col py-2 overflow-y-auto flex-1"></div>
        </aside>

        <div id="otherContent" class="flex-1 min-w-0"></div>
      </div>
    </section>

  </main>

  <footer class="border-t border-ink-800 mt-16">
    <div class="max-w-[1600px] mx-auto px-6 md:px-10 py-8 flex flex-col items-center gap-2">
      <p class="text-xs text-ink-500">腾讯视频端内素材收集与展示平台 · 内部工具</p>
      <p>由 <a href="https://with.woa.com/" style="color: #8A2BE2;" target="_blank">With</a> 通过自然语言生成</p>
    </div>
  </footer>

<script type="module" src="./main.js"></script>
</body>
</html>
